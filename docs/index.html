<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evergreen Love Studio</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 5 11h3l-4 6h6v5h4v-5h6l-4-6h3z" fill="currentColor"/></svg>
    <span>Evergreen Love Studio</span>
  </div>
  <input id="docName" class="doc-name" value="Mi diseño" aria-label="Nombre del diseño" spellcheck="false">
  <div class="actions">
    <button id="btnNew" title="Nuevo diseño">Nuevo</button>
    <button id="btnOpen" title="Abrir un diseño guardado (.json) o importar SVG, DXF, PNG o JPG (Ctrl+O)">Abrir</button>
    <button id="btnImport" title="Importar un archivo SVG, DXF, PNG o JPG para editarlo">Importar</button>
    <button id="btnSave" title="Guardar diseño en tu computadora (Ctrl+S)">Guardar</button>
    <span class="divider"></span>
    <button id="btnUndo" class="icon-btn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
    <button id="btnRedo" class="icon-btn" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer">↷</button>
    <span class="divider"></span>
    <div class="menu">
      <button id="btnTemplates" aria-haspopup="true">Plantillas ▾</button>
      <div class="menu-list" id="menuTemplates" hidden>
        <button data-template="box-dedos">Caja con dedos (finger joint)</button>
        <button data-template="box-planas">Caja sin dedos (para pegar)</button>
        <button data-template="box-slide">Caja con tapa deslizante</button>
        <button data-template="box-drawer">Caja con cajón</button>
        <button data-template="keychain">Llavero (con agujero y nombre)</button>
        <button data-template="coasters">Posavasos en cuadrícula</button>
        <button data-template="hinge">Muestra de bisagra viva</button>
      </div>
    </div>
    <button id="btnView3d" title="Ver la caja armada en 3D">Vista 3D</button>
    <button id="btnExportDxf" title="Descargar DXF (en mm)">DXF</button>
    <button id="btnExport" class="primary" title="Descargar SVG para xTool Creative Space">Exportar SVG</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json,.svg,image/svg+xml,.dxf,.png,.jpg,.jpeg,image/png,image/jpeg" hidden>
</header>

<div class="main">
  <nav class="tools" id="tools" aria-label="Herramientas">
    <button data-tool="select" title="Seleccionar y mover (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
    <button data-tool="hand" title="Mover la vista (H o barra espaciadora)"><svg viewBox="0 0 24 24"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v5M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V11M16 11V8a1.5 1.5 0 0 1 3 0v6c0 4-3 7-7 7-3 0-4.5-1.5-6.5-4L3 14a1.5 1.5 0 0 1 2.3-2L7 14"/></svg></button>
    <span class="tool-sep"></span>
    <button data-tool="rect" title="Rectángulo (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button data-tool="circle" title="Círculo (C)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
    <button data-tool="polygon" title="Polígono (P)"><svg viewBox="0 0 24 24"><path d="M12 3l8 5v8l-8 5-8-5V8z"/></svg></button>
    <button data-tool="line" title="Línea (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button data-tool="text" title="Texto (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <span class="tool-sep"></span>
    <button data-tool="panel" title="Panel con dedos para cajas (F)"><svg viewBox="0 0 24 24"><path d="M4 4h3v2h3V4h4v2h3V4h3v16h-3v-2h-3v2h-4v-2H7v2H4z"/></svg></button>
    <button data-tool="box" title="Caja paramétrica (K)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
    <button data-tool="hinge" title="Bisagra viva (B)"><svg viewBox="0 0 24 24"><path d="M5 3v7M5 13v8M9 3v3M9 9v7M9 19v2M13 3v7M13 13v8M17 3v3M17 9v7M17 19v2"/></svg></button>
  </nav>

  <div class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridMinor" patternUnits="userSpaceOnUse" width="1" height="1"><path class="grid-minor" vector-effect="non-scaling-stroke" fill="none"/></pattern>
        <pattern id="gridMajor" patternUnits="userSpaceOnUse" width="10" height="10"><path class="grid-major" vector-effect="non-scaling-stroke" fill="none"/></pattern>
      </defs>
      <rect id="gridA" fill="url(#gridMinor)"/>
      <rect id="gridB" fill="url(#gridMajor)"/>
      <rect id="sheet" class="sheet" vector-effect="non-scaling-stroke"/>
      <path id="axes" class="axes" vector-effect="non-scaling-stroke"/>
      <g id="layerShapes"></g>
      <g id="layerOverlay"></g>
    </svg>
    <div class="view3d" id="view3d" hidden>
      <div class="view3d-bar">
        <strong id="view3dTitle">Vista 3D</strong>
        <label class="range"><span id="explodeLabel">Separar piezas</span> <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
        <button id="btnView3dFit">Centrar</button>
        <button id="btnView3dClose" class="primary">Cerrar</button>
      </div>
      <div class="view3d-canvas" id="view3dCanvas"></div>
      <p class="view3d-help">Arrastra para girar · rueda para acercar · clic derecho para desplazar · Esc para cerrar</p>
      <p class="view3d-msg" id="view3dMsg" hidden></p>
    </div>
    <div class="stage-controls">
      <button id="btnZoomOut" class="icon-btn" title="Alejar" aria-label="Alejar">−</button>
      <span id="zoomLabel">100%</span>
      <button id="btnZoomIn" class="icon-btn" title="Acercar" aria-label="Acercar">+</button>
      <button id="btnFit" title="Ver todo (0)">Ver todo</button>
      <label class="check"><input type="checkbox" id="chkSnap" checked> Imán</label>
      <select id="unitSelect" aria-label="Unidades" title="Unidades de medida">
        <option value="mm">mm</option>
        <option value="in">pulgadas</option>
      </select>
    </div>
  </div>

  <aside class="side">
    <section>
      <div class="section-head"><h2>Parámetros</h2><button id="btnAddParam" class="small">+ Nuevo</button></div>
      <div id="params"></div>
    </section>
    <section>
      <div class="section-head"><h2>Propiedades</h2></div>
      <div id="inspector"></div>
    </section>
    <section>
      <div class="section-head"><h2>Objetos</h2></div>
      <ul id="objects"></ul>
    </section>
  </aside>
</div>

<footer class="status">
  <span id="stCoords">x 0 · y 0 mm</span>
  <span id="stMsg"></span>
</footer>

<script src="lib/clipper.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="app.js"></script>
</body>
</html>
