<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evergreen Love Studio</title>
<link rel="stylesheet" href="estilos.css?v=20261019-estudio-20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evergreen">
<script>
/* Si Safari guardó una copia vieja de esta página, se vuelve a cargar con la versión nueva. */
(function () {
  var BUILD = "estudio-20";
  try {
    fetch('version.txt?x=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      t = (t || '').trim();
      if (t && t !== BUILD && location.search.indexOf('b=' + t) < 0) location.replace(location.pathname + '?b=' + encodeURIComponent(t));
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 5 11h3l-4 6h6v5h4v-5h6l-4-6h3z" fill="currentColor"/></svg>
    <span>Evergreen Love Studio</span>
    <span id="buildTag" class="build-tag" title="Versión de la página que estás usando">v estudio-20</span>
  </div>
  <input id="docName" class="doc-name" value="Mi diseño" aria-label="Nombre del diseño" spellcheck="false">
  <div class="seg" id="unitSeg" role="group" aria-label="Trabajar en milímetros o pulgadas"><button type="button" data-u="mm" title="Trabajar en milímetros">mm</button><button type="button" data-u="in" title="Trabajar en pulgadas">pulgadas</button></div>
  <div class="actions">
    <button id="btnNew" title="Nuevo diseño">Nuevo</button>
    <button id="btnOpen" title="Abrir un diseño guardado (.json) o importar SVG, DXF, PNG o JPG (Ctrl+O)">Abrir</button>
    <button id="btnImport" title="Importar un archivo SVG, DXF, PNG o JPG para editarlo">Importar</button>
    <button id="btnSave" title="Guarda un SVG: se abre en xTool y también aquí para seguir editando (Ctrl+S)">Guardar</button>
    <button id="btnSaveJson" title="Copia de seguridad en .json (solo la abre esta aplicación)">.json</button>
    <span class="divider"></span>
    <button id="btnUndo" class="icon-btn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
    <button id="btnRedo" class="icon-btn" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer">↷</button>
    <span class="divider"></span>
    <div class="menu">
      <button id="btnTemplates" aria-haspopup="true">Plantillas ▾</button>
      <div class="menu-list" id="menuTemplates" hidden>
        <button data-template="box-dedos">Caja con dedos (finger joint)</button>
        <button data-template="box-planas">Caja sin dedos (para pegar)</button>
        <button data-template="box-slide">Caja con tapa deslizante</button>
        <button data-template="box-gift-quarter">Caja de regalo (madera 1/4″)</button>
        <button data-template="box-hinge-lid">Caja con tapa de lengüeta (sobresale por atrás) y cubierta aparte</button>
        <button data-template="box-pivot-lid">Caja con bisagra de espigas (la tapa gira en los lados)</button>
        <button data-template="box-pivot-tab-lid">Caja con lengüeta al frente y bisagra de espigas</button>
        <button data-template="box-book">Caja libro (una plancha con bisagra viva y paredes en ranuras)</button>
        <button data-template="box-living-hinge">Caja de una plancha con bisagra viva (tapa + base unidas)</button>
        <button data-template="box-drawer">Caja con cajón</button>
        <button data-template="basket">Canasta con asa</button>
        <button data-template="typetray">Bandeja de pared con compartimentos (TypeTray)</button>
        <button data-template="taper">Caja cónica (más ancha arriba)</button>
        <button data-template="planter-round">Maceta redonda para arreglos florales (bisagra viva, no se desarma)</button>
        <button data-template="planter-half">Maceta media redonda para arreglos florales (bisagra viva)</button>
        <button data-template="taper-55-65">Caja cónica 5.5″ abajo → 6.5″ arriba (pulgadas)</button>
        <button data-template="cone">Cono con bisagra viva</button>
        <button data-template="names-batch">Etiquetas para nombres por lote</button>
        <button data-template="keychain">Llavero (con agujero y nombre)</button>
        <button data-template="coasters">Posavasos en cuadrícula</button>
        <button data-template="hinge">Muestra de bisagra viva</button>
        <button data-template="kerf-test">Prueba de kerf (ranuras de distinto ancho)</button>
        <div class="menu-sep"></div>
        <div id="userTemplates"></div>
        <button id="btnSaveTemplate" class="menu-save">＋ Guardar diseño actual como plantilla…</button>
        <button id="btnSyncTemplates" class="menu-save" title="Mismas plantillas en todos tus aparatos, con tu Worker de Cloudflare (gratis)">☁ Sincronizar plantillas…</button>
        <button id="btnExportTemplates" class="menu-save" title="Guarda todas tus plantillas en un archivo para llevarlas a otro aparato (iPad, otra computadora)">⇪ Exportar mis plantillas (para otro aparato)…</button>
        <button id="btnImportTemplates" class="menu-save" title="Trae las plantillas que exportaste en otro aparato">⇩ Importar plantillas…</button>
      </div>
    </div>
    <button id="btnNest" title="Acomodar las piezas para ahorrar madera">Acomodar</button>
    <button id="btnCount" title="Calcular cuántas planchas de madera necesitas para tus cajas">¿Cuánta madera?</button>
    <button id="btnBatch" class="primary" title="Crear copias con distintos nombres">Nombres por lote</button>
    <button id="btnView3d" title="Ver la caja armada en 3D">Vista 3D</button>
    <button id="btnExportDxf" title="Descargar DXF (en mm)">DXF</button>
    <button id="btnExport" class="primary" title="Descargar SVG para xTool Creative Space">Exportar SVG</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json,.svg,image/svg+xml,.dxf,.png,.jpg,.jpeg,image/png,image/jpeg" hidden>
</header>

<div class="main">
  <nav class="tools" id="tools" aria-label="Herramientas">
    <div class="tools-col">
    <button data-tool="select" title="Seleccionar y mover (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
    <button data-tool="hand" title="Mover la vista (H o barra espaciadora)"><svg viewBox="0 0 24 24"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v5M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V11M16 11V8a1.5 1.5 0 0 1 3 0v6c0 4-3 7-7 7-3 0-4.5-1.5-6.5-4L3 14a1.5 1.5 0 0 1 2.3-2L7 14"/></svg></button>
    <span class="tool-sep"></span>
    <button data-tool="rect" title="Rectángulo (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button data-tool="circle" title="Círculo (C)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
    <button data-tool="polygon" title="Polígono (P)"><svg viewBox="0 0 24 24"><path d="M12 3l8 5v8l-8 5-8-5V8z"/></svg></button>
    <button data-tool="line" title="Línea (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button data-tool="pen" title="Pluma (N): dibuja curvas. Clic = esquina, arrastrar = curva suave; clic en el primer punto cierra; Enter o doble clic termina"><svg viewBox="0 0 24 24"><path d="M12 3l4 8-4 10-4-10z"/><circle cx="12" cy="12" r="1.6"/><path d="M12 13.5V21"/></svg></button>
    <button data-tool="measure" title="Medir (M): mide entre dos puntos o una ranura"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M6.5 13.5l2 2M9.5 10.5l2 2M12.5 7.5l2 2"/></svg></button>
    <button data-tool="text" title="Texto (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <span class="tool-sep"></span>
    <button data-tool="panel" title="Panel con dedos para cajas (F)"><svg viewBox="0 0 24 24"><path d="M4 4h3v2h3V4h4v2h3V4h3v16h-3v-2h-3v2h-4v-2H7v2H4z"/></svg></button>
    <button data-tool="box" title="Caja paramétrica (K)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
    <button data-tool="hinge" title="Bisagra viva (B)"><svg viewBox="0 0 24 24"><path d="M5 3v7M5 13v8M9 3v3M9 9v7M9 19v2M13 3v7M13 13v8M17 3v3M17 9v7M17 19v2"/></svg></button>
      </div>
    <div class="tools-col tools-acts">
    <button data-act="group" title="Agrupar lo elegido (Ctrl+G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="2.5 2"/><rect x="6.5" y="6.5" width="5" height="5"/><rect x="12.5" y="12.5" width="5" height="5"/></svg></button>
    <button data-act="ungroup" title="Desagrupar (Ctrl+Shift+G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/><path d="M14 4l6 0M17 4v0M13 8l7 0" stroke-dasharray="1 2.5"/></svg></button>
    <button data-act="unir" title="Unir: junta las figuras en una sola silueta"><svg viewBox="0 0 24 24"><path d="M9 4h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-3v-3H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg></button>
    <button data-act="restar" title="Restar: a la figura de más abajo le quita las demás"><svg viewBox="0 0 24 24"><path d="M4 4h10v4H8v8H4z"/><circle cx="15" cy="15" r="5" stroke-dasharray="2 2"/></svg></button>
    <button data-act="intersectar" title="Intersectar: deja solo donde se cruzan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" stroke-dasharray="2 2"/><rect x="9" y="9" width="12" height="12" stroke-dasharray="2 2"/><path d="M9 9h6v6H9z" fill="currentColor"/></svg></button>
    <button data-act="excluir" title="Excluir: deja todo menos donde se cruzan"><svg viewBox="0 0 24 24"><path d="M3 3h12v6H9v6H3zM9 15h6V9h6v12H9z"/></svg></button>
    <span class="tool-sep"></span>
    <span class="tool-sep"></span>
    <button data-act="scissors" title="Tijera: corta el contorno en un punto o borde (toca después)"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5L20 18M8 16.5L20 6"/></svg></button>
    <button data-act="simplify" title="Simplificar: cambia muchos puntos por pocos nodos con manijas"><svg viewBox="0 0 24 24"><path d="M3 18C6 6 10 6 12 12s6 6 9-6"/><circle cx="3" cy="18" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="21" cy="6" r="1.6"/></svg></button>
    <button data-act="dup" title="Duplicar lo elegido (Cmd+D)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
    <button data-act="del" title="Eliminar lo elegido (Supr)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
    </div>
  </nav>

  <div class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridMinor" patternUnits="userSpaceOnUse" width="1" height="1"><path class="grid-minor" vector-effect="non-scaling-stroke" fill="none"/></pattern>
        <pattern id="gridMajor" patternUnits="userSpaceOnUse" width="10" height="10"><path class="grid-major" vector-effect="non-scaling-stroke" fill="none"/></pattern>
      </defs>
      <rect id="gridA" fill="url(#gridMinor)"/>
      <rect id="gridB" fill="url(#gridMajor)"/>
      <rect id="sheet" class="sheet" vector-effect="non-scaling-stroke"/>
      <path id="axes" class="axes" vector-effect="non-scaling-stroke"/>
      <g id="layerShapes"></g>
      <g id="layerOverlay"></g>
    </svg>
    <canvas id="rulerTop" class="ruler ruler-top" title="Arrastra hacia el lienzo para crear una guía"></canvas>
    <canvas id="rulerLeft" class="ruler ruler-left" title="Arrastra hacia el lienzo para crear una guía"></canvas>
    <div class="ruler-corner"></div>
    <div class="view3d" id="view3d" hidden>
      <div class="view3d-bar">
        <strong id="view3dTitle">Vista 3D</strong>
        <label class="range"><span>Madera</span> <select id="woodMain" aria-label="Color de la madera en 3D"></select></label>
        <label class="range"><span>Cubierta</span> <select id="woodCover" aria-label="Color de la cubierta en 3D"></select></label>
        <span class="v3cam"><button id="v3Home" title="Vista inicial">Inicio</button><button id="v3Top" title="Desde arriba">Arriba</button><button id="v3Front" title="De frente">Frente</button><button id="v3Spin" title="Girar sola">Girar</button><button id="v3Img" title="Guarda una imagen PNG de lo que ves">Guardar imagen</button></span>
        <button id="btnView3dFit">Centrar</button>
        <button id="btnView3dClose" class="primary">Cerrar</button>
      </div>
      <div class="v3body">
        <aside class="v3left" id="v3Left"><div id="v3Style"></div><div class="v3sizes" id="v3Sizes" hidden></div></aside>
        <div class="v3center">
          <div class="v3tabs" role="tablist"><button id="v3Tab3d" class="active" role="tab" aria-selected="true">Vista 3D</button><button id="v3TabPlan" role="tab" aria-selected="false">Plano de corte</button></div>
          <div class="view3d-canvas" id="view3dCanvas"></div>
          <div class="v3plan" id="v3Plan" hidden></div>
          <div class="v3float" id="v3Float">
            <label class="range" id="openLidWrap"><span id="openLidLabel">Abrir la tapa</span> <input type="range" id="openLid" min="0" max="1" step="0.01" value="0"></label>
            <label class="range" id="explodeWrap"><span id="explodeLabel">Separar piezas</span> <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
          </div>
        </div>
        <aside class="v3right" id="v3Right"></aside>
      </div>
      <p class="view3d-help">Arrastra para girar · rueda para acercar · clic derecho para desplazar · Esc para cerrar</p>
      <p class="view3d-msg" id="view3dMsg" hidden></p>
    </div>
    <div class="measure-bar" id="selBar" hidden>
      <button id="btnSelGroup" class="active" title="Agrupa lo elegido sin combinar (Ctrl+G)">Agrupar</button>
      <button id="btnSelUngroup" title="Separa el grupo o la caja en piezas (Ctrl+Shift+G)">Desagrupar</button>
      <button id="btnSelWeld" hidden title="Une las letras que se tocan en un solo contorno (cursivas, nombres para llaveros)">Soldar letras</button>
      <button id="btnSelBack" title="Manda lo elegido detrás de todas las figuras (Cmd+Shift+[ )">Al fondo</button>
      <button id="btnSelFront" title="Trae lo elegido delante de todas las figuras (Cmd+Shift+] )">Al frente</button>
      <button id="btnSelDup" title="Duplicar">Duplicar</button>
      <button id="btnSelDel" title="Eliminar lo elegido">Eliminar</button>
    </div>
    <div class="measure-bar" id="nodeBar" hidden>
      <button id="btnNodeAll" class="active" title="Elige todos los puntos de las figuras elegidas (Cmd+A): al arrastrar uno se mueven todos juntos">Elegir todos los puntos</button>
      <button id="btnNodeDel" class="danger" title="Borra los puntos elegidos (Supr). Si están todos, se borra el contorno entero">Borrar puntos</button>
      <button id="btnNodeCut" title="Corta el contorno en los puntos elegidos">Tijera</button>
      <button id="btnNodeClear" title="Deja de tener puntos elegidos (Esc)">Quitar elección</button>
    </div>
    <div class="measure-bar" id="penBar" hidden>
      <button id="btnPenDone" class="active" title="Termina el trazo (como doble clic o Enter)">Terminar</button>
      <button id="btnPenClose" title="Une el último punto con el primero">Cerrar forma</button>
      <button id="btnPenCancel" title="Borra el trazo que llevas (Esc)">Cancelar</button>
    </div>
    <div class="measure-bar" id="measureBar" hidden>
      <button id="btnMeasTwo" class="active" title="Haz clic en dos puntos">Entre dos puntos</button>
      <button id="btnMeasShape" title="Un clic dentro de una ranura, agujero o pieza mide su ancho y largo">Ranura o contorno</button>
      <button id="btnMeasClear" title="Borra todas las medidas">Borrar medidas</button>
    </div>
    <button id="btnSideToggle" class="side-toggle" title="Abrir o cerrar el panel de Parámetros y Propiedades" aria-label="Abrir o cerrar el panel de Parámetros" aria-expanded="true">▶</button>
    <div class="stage-controls">
      <button id="btnZoomOut" class="icon-btn" title="Alejar" aria-label="Alejar">−</button>
      <span id="zoomLabel">100%</span>
      <button id="btnZoomIn" class="icon-btn" title="Acercar" aria-label="Acercar">+</button>
      <button id="btnFit" title="Ver todo (0)">Ver todo</button>
      <label class="check" title="Para elegir varias piezas o puntos con el dedo, sin Shift"><input type="checkbox" id="chkAdd"> Sumar</label>
      <label class="check"><input type="checkbox" id="chkSnap" checked> Imán</label>
      <select id="unitSelect" aria-label="Unidades" title="Unidades de medida">
        <option value="mm">mm</option>
        <option value="in">pulgadas</option>
      </select>
    </div>
  </div>

  <aside class="side">
    <section>
      <div class="section-head"><h2>Parámetros</h2><button id="btnAddParam" class="small">+ Nuevo</button></div>
      <div id="params"></div>
    </section>
    <section>
      <div class="section-head"><h2>Propiedades</h2></div>
      <div id="inspector"></div>
    </section>
    <section>
      <div class="section-head"><h2>Objetos</h2><span id="layerBtns" class="layer-btns"></span></div>
      <ul id="objects"></ul>
    </section>
    <section>
      <div class="section-head"><h2>Medidas</h2><button id="btnMeasClear2" class="small">Borrar todas</button></div>
      <ul id="measureList"></ul>
    </section>
  </aside>
</div>

<footer class="status">
  <span id="stCoords">x 0 · y 0 mm</span>
  <span id="stMsg"></span>
</footer>

<script src="lib/clipper.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/opentype.min.js"></script>
<script src="app.js?v=20261019-estudio-20"></script>
<script>
/* Uso sin internet: se guarda una copia de la aplicación en este aparato (hace falta abrirla una vez con internet). */
(function () {
  var tag = function () { return document.getElementById('buildTag'); };
  function estado(texto, listo) {
    var t = tag(); if (!t) return;
    t.dataset.base = t.dataset.base || t.textContent;
    t.textContent = t.dataset.base + (texto ? ' · ' + texto : '');
    t.title = listo ? 'La aplicación está guardada en este aparato: funciona sin internet.' : 'Versión de la página que estás usando';
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'offline-listo') estado('sin internet ✓', true);
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function () {
        return navigator.serviceWorker.ready;
      }).then(function () { estado('sin internet ✓', true); }).catch(function () {});
    });
  }
  window.addEventListener('offline', function () { estado('sin conexión', true); });
  window.addEventListener('online', function () { estado('sin internet ✓', true); });
})();
</script>
</body>
</html>
